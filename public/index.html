<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diccionario de Python para Machine Learning</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="cabecera">
    <h1>Diccionario de Python para Machine Learning</h1>
    <p>Palabras, librerías y modos de programar, con sintaxis, ejemplos y uso en ML.</p>
  </header>

  <main class="contenedor">
    <section class="controles">
      <input id="buscador" type="search" placeholder="Buscar un término (por ejemplo: pandas, lambda, pipeline)" />
      <select id="filtro">
        <option value="">Todas las categorías</option>
      </select>
    </section>

    <p id="contador" class="contador"></p>
    <section id="lista" class="lista"></section>
  </main>

  <footer class="pie">
    <p>Proyecto de Machine Learning - Universidad de Cundinamarca</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
